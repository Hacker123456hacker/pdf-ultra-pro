<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Protect PDF — PDF Ultra Pro</title><link rel="icon" href="icons/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="css/style.css"></head><body><div id="site-header"></div><main class="tool-page"><div class="container"><nav class="breadcrumb"><a href="index.html">Home</a><span>/</span><a href="all-tools.html">All Tools</a><span>/</span><span>Protect PDF</span></nav><header class="tool-header"><div class="tool-icon">🔒</div><h1>Protect PDF</h1><p>Password-protect your PDF directly in your browser. No server upload.</p></header><div class="tool-app"><div class="glass" style="padding:28px"><div class="alert alert-info">🔒 Your PDF stays on this device. No upload is needed.</div><label class="dropzone" id="dropzone" tabindex="0" for="pdfFile" aria-label="Choose PDF file"><input id="pdfFile" type="file" accept="application/pdf,.pdf" style="position:absolute;width:1px;height:1px;opacity:0;pointer-events:none"><div style="font-size:36px;line-height:1">↑</div><p style="margin:8px 0;font-weight:600">Tap here to choose your PDF</p><p class="dz-hint">PDF · up to 100MB</p></label><div id="fileList" class="file-list"></div><div id="options" style="display:none"><label class="option-group"><span>Password</span><input id="password" type="password" autocomplete="new-password" placeholder="Enter a strong password" class="text-input"></label><label class="option-group"><span>Confirm password</span><input id="confirm" type="password" autocomplete="new-password" placeholder="Re-enter password" class="text-input"></label><button id="protectBtn" type="button" class="btn btn-primary">🔒 Protect & Download PDF</button></div><div id="status" class="alert" style="display:none;margin-top:18px"></div></div></div></div></main><div id="site-footer"></div><script src="js/theme.js"></script><script src="js/partials.js"></script><script>document.addEventListener('DOMContentLoaded',function(){var file=null,input=document.getElementById('pdfFile'),dz=document.getElementById('dropzone'),list=document.getElementById('fileList'),options=document.getElementById('options'),status=document.getElementById('status');function msg(t,ok){status.style.display=t?'block':'none';status.className='alert '+(ok?'alert-success':'alert-error');status.textContent=t||''}function render(){list.replaceChildren();if(!file){options.style.display='none';return}var row=document.createElement('div'),meta=document.createElement('div'),name=document.createElement('div'),size=document.createElement('div'),remove=document.createElement('button');row.className='file-row';meta.className='file-meta';name.className='file-name';name.textContent=file.name;size.className='file-size';size.textContent=(file.size/1048576).toFixed(2)+' MB';meta.append(name,size);remove.type='button';remove.className='file-remove';remove.textContent='×';remove.onclick=function(){file=null;input.value='';render()};row.append(meta,remove);list.append(row);options.style.display='block'}function setFile(f){if(!f)return;if(f.type!=='application/pdf'&&!/\.pdf$/i.test(f.name))return msg('Please choose a PDF file.');if(f.size>100*1024*1024)return msg('PDF is larger than 100MB.');file=f;msg('');render()}input.addEventListener('change',function(e){setFile(e.target.files&&e.target.files[0])});dz.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();input.click()}});dz.addEventListener('dragover',function(e){e.preventDefault();dz.classList.add('dragover')});dz.addEventListener('dragleave',function(){dz.classList.remove('dragover')});dz.addEventListener('drop',function(e){e.preventDefault();dz.classList.remove('dragover');setFile(e.dataTransfer&&e.dataTransfer.files&&e.dataTransfer.files[0])});document.getElementById('protectBtn').addEventListener('click',async function(){var p=document.getElementById('password').value,c=document.getElementById('confirm').value;if(!file)return msg('Please upload a PDF first.');if(!p)return msg('Please enter a password.');if(p!==c)return msg('Passwords do not match.');var b=this;b.disabled=true;b.textContent='Loading engine…';try{msg('Loading PDF security engine…',true);var mod=await import('./js/pdf-security.js');var out=await mod.protectPdf(file,p);var u=URL.createObjectURL(new Blob([out],{type:'application/pdf'}));var a=document.createElement('a');a.href=u;a.download=file.name.replace(/\.pdf$/i,'')+'-protected.pdf';document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(u)},3000);msg('PDF protected successfully.',true)}catch(e){console.error(e);msg('Could not protect this PDF: '+(e&&e.message||'PDF engine error'))}finally{b.disabled=false;b.textContent='🔒 Protect & Download PDF'}})});</script></body></html>
