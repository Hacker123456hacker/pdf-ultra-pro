<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Report a Problem — PDF Ultra Pro</title>
<meta name="description" content="Report a PDF Ultra Pro bug or tool problem directly to Abhishek.">
<link rel="canonical" href="https://pdf-ultra-pro.pages.dev/report-problem.html">
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#6C4CF0">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="site-header"></div>
<main id="main-content">
  <div class="container">
    <div class="page-hero">
      <span class="eyebrow">Support</span>
      <h1>Report a Problem</h1>
      <p style="max-width:62ch;margin:0 auto;">Tell us what went wrong. Your report will be sent directly to the PDF Ultra Pro support email.</p>
    </div>
  </div>
  <section class="section section-tight">
    <div class="container">
      <div class="glass" style="max-width:620px;margin:0 auto;padding:32px;">
        <form action="https://formsubmit.co/abhishekv8471@gmail.com" method="POST">
          <input type="hidden" name="_subject" value="PDF Ultra Pro — Problem Report">
          <input type="hidden" name="_captcha" value="false">
          <input type="hidden" name="_template" value="table">
          <input type="hidden" name="_next" value="https://pdf-ultra-pro.pages.dev/report-problem.html?sent=1">
          <div class="option-group"><label for="p-name">Your name</label><input type="text" id="p-name" name="name" required maxlength="100" autocomplete="name"></div>
          <div class="option-group"><label for="p-email">Your email</label><input type="email" id="p-email" name="email" required maxlength="200" autocomplete="email"></div>
          <div class="option-group"><label for="p-tool">Which tool has the problem?</label><select id="p-tool" name="tool" required><option value="">Select a tool</option><option>Merge PDF</option><option>Split PDF</option><option>Rotate PDF</option><option>Delete Pages</option><option>Extract Pages</option><option>Reorder Pages</option><option>Crop PDF</option><option>Watermark PDF</option><option>Sign PDF</option><option>Compress PDF</option><option>Repair PDF</option><option>PDF to JPG</option><option>JPG/PNG to PDF</option><option>PDF to Text</option><option>Extract Images</option><option>Word to PDF</option><option>Excel to PDF</option><option>PowerPoint to PDF</option><option>OCR PDF</option><option>Preview PDF</option><option>Compare PDFs</option><option>Other</option></select></div>
          <div class="option-group"><label for="p-type">Problem type</label><select id="p-type" name="problem_type"><option>Tool not working</option><option>Error message</option><option>Wrong output</option><option>Mobile issue</option><option>Suggestion</option><option>Other</option></select></div>
          <div class="option-group"><label for="p-message">Describe the problem</label><textarea id="p-message" name="message" required maxlength="5000" placeholder="Explain what you did, what happened, and what you expected…"></textarea></div>
          <p style="font-size:.9em;opacity:.8;">Please do not include confidential documents, passwords, or other sensitive information in this form.</p>
          <button type="submit" class="btn btn-primary btn-block">Send Problem Report</button>
        </form>
      </div>
    </div>
  </section>
</main>
<div id="site-footer"></div>
<script src="js/theme.js"></script>
<script src="js/partials.js"></script>
<script src="js/main.js"></script>
</body>
</html>
