<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Protect PDF — PDF Ultra Pro</title><meta name="description" content="Password-protect a PDF in your browser using real PDF encryption. Files stay on your device."><link rel="canonical" href="https://pdf-ultra-pro.pages.dev/protect-pdf.html"><link rel="icon" href="icons/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="css/style.css"></head>
<body><div id="site-header"></div><main class="tool-page" id="main-content"><div class="container"><nav class="breadcrumb" aria-label="Breadcrumb"><a href="index.html">Home</a><span>/</span><a href="all-tools.html">All Tools</a><span>/</span><span>Protect PDF</span></nav><header class="tool-header"><div class="tool-icon" aria-hidden="true"><svg width="26" height="26" viewBox="0 0 24 24" fill="none"><rect x="5" y="11" width="14" height="9" rx="2" stroke="currentColor" stroke-width="1.8"/><path d="M8 11V8a4 4 0 0 1 8 0v3" stroke="currentColor" stroke-width="1.8"/></svg></div><h1>Protect PDF</h1><p>Password-protect your PDF directly in your browser. No server upload.</p></header><div class="tool-app"><div class="glass" style="padding:28px"><div class="alert alert-info" style="margin-top:0">🔒 Your PDF is processed locally in this browser. The password is not sent to our server.</div><label class="option-group" style="display:block"><span>Choose PDF</span><input id="pdfFile" type="file" accept="application/pdf" class="file-input"></label><label class="option-group" style="display:block"><span>Password</span><input id="password" type="password" autocomplete="new-password" minlength="1" placeholder="Enter a strong password" class="text-input"></label><label class="option-group" style="display:block"><span>Confirm password</span><input id="confirm" type="password" autocomplete="new-password" minlength="1" placeholder="Re-enter password" class="text-input"></label><button id="protectBtn" type="button" class="btn btn-primary">🔒 Protect & Download PDF</button><div id="status" class="alert" style="display:none;margin-top:18px"></div><p style="margin-top:18px;color:var(--text-muted);font-size:.92rem">Uses AES-256 PDF encryption in modern browsers. Keep your password safe.</p></div></div></div></main><div id="site-footer"></div><script src="js/theme.js"></script><script src="js/partials.js"></script><script src="https://cdn.jsdelivr.net/npm/@cantoo/pdf-lib@2.9.1/dist/pdf-lib.min.js"></script><script>(function(){const $=id=>document.getElementById(id);const status=(m,ok)=>{const s=$("status");s.style.display="block";s.className="alert "+(ok?"alert-success":"alert-error");s.textContent=m;};$("protectBtn").addEventListener("click",async()=>{const f=$("pdfFile").files[0],p=$("password").value,c=$("confirm").value;if(!f)return status("Please choose a PDF first.");if(!p)return status("Please enter a password.");if(p!==c)return status("Passwords do not match.");const b=$("protectBtn");b.disabled=true;b.textContent="Protecting…";try{if(!window.PDFLib||!PDFLib.PDFDocument)throw new Error("engine");const bytes=new Uint8Array(await f.arrayBuffer());const doc=await PDFLib.PDFDocument.load(bytes);doc.encrypt({userPassword:p,ownerPassword:p,permissions:{printing:"highResolution",modifying:false,copying:false,annotating:false}});const out=await doc.save({useObjectStreams:false});const blob=new Blob([out],{type:"application/pdf"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=f.name.replace(/\.pdf$/i,"")+"-protected.pdf";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);status("PDF protected successfully.",true);}catch(e){console.error(e);status("Could not protect this PDF. It may already be encrypted or use an unsupported PDF feature.");}finally{b.disabled=false;b.textContent="🔒 Protect & Download PDF";}});})();</script></body></html>
