name: AI YouTube Daily Agent

on:
  workflow_dispatch:
  schedule:
    # 05:00 Asia/Kolkata = 23:30 UTC (previous day)
    - cron: '30 23 * * *'

permissions:
  contents: read

jobs:
  create-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-2.5-flash' }}
      YOUTUBE_CLIENT_SECRET_JSON: ${{ secrets.YOUTUBE_CLIENT_SECRET_JSON }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      VIDEO_LANGUAGE: ${{ vars.VIDEO_LANGUAGE || 'hi-IN' }}
      VIDEO_VOICE: ${{ vars.VIDEO_VOICE || 'hi-IN-SwaraNeural' }}
      VIDEO_PRIVACY: ${{ vars.VIDEO_PRIVACY || 'private' }}
      VIDEO_DURATION: ${{ vars.VIDEO_DURATION || '60' }}
      OUTPUT_DIR: output
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install FFmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Python packages
        run: python -m pip install -r ai-youtube-agent/requirements.txt

      - name: Generate, render and upload
        run: python ai-youtube-agent/agent.py

      - name: Save generated MP4 and plan
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-youtube-daily-${{ github.run_number }}
          path: output/
          if-no-files-found: warn
          retention-days: 7
