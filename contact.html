<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact \u2014 PDF Ultra Pro</title>
<meta name="description" content="Get in touch with the PDF Ultra Pro team with questions, feedback or bug reports.">
<link rel="canonical" href="https://pdf-ultra-pro.pages.dev/contact.html">
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#6C4CF0">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="site-header"></div>
<main id="main-content">
  <div class="container">
    <div class="page-hero">
      <span class="eyebrow">Contact</span>
      <h1>We'd like to hear from you</h1>
      <p style="max-width:56ch;margin:0 auto;">Bug reports, feature requests, or just letting us know a tool saved you time \u2014 all welcome.</p>
    </div>
  </div>
  <section class="section section-tight">
    <div class="container">
      <div class="glass contact-form" style="max-width:560px;margin:0 auto;padding:32px;">
        <form id="contact-form">
          <div class="option-group">
            <label for="c-name">Your name</label>
            <input type="text" id="c-name" name="name" required maxlength="100" autocomplete="name">
          </div>
          <div class="option-group">
            <label for="c-email">Email address</label>
            <input type="email" id="c-email" name="email" required maxlength="200" autocomplete="email">
          </div>
          <div class="option-group">
            <label for="c-topic">Topic</label>
            <select id="c-topic" name="topic">
              <option>General feedback</option>
              <option>Bug report</option>
              <option>Feature request</option>
              <option>Advertising / partnerships</option>
            </select>
          </div>
          <div class="option-group">
            <label for="c-message">Message</label>
            <textarea id="c-message" name="message" required maxlength="2000" placeholder="Tell us what's on your mind…"></textarea>
          </div>
          <button type="submit" class="btn btn-primary btn-block">Send message</button>
          <div id="contact-status" role="status" style="margin-top:14px;"></div>
        </form>
      </div>
    </div>
  </section>
</main>
<div id="site-footer"></div>
<script src="js/theme.js"></script>
<script src="js/partials.js"></script>
<script src="js/main.js"></script>
</body>
</html>
