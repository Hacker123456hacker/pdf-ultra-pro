name: Add AdSense script

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  add-adsense:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add ad scripts to HTML pages
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          scripts = [
              '''<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8279679003849482"
               crossorigin="anonymous"></script>''',
          ]

          markers = [
              'ca-pub-8279679003849482',
          ]

          for path in Path('.').rglob('*.html'):
              if '.git' in path.parts:
                  continue
              text = path.read_text(encoding='utf-8')
              if '<head>' not in text:
                  continue
              changed = False
              for script, marker in zip(scripts, markers):
                  if marker not in text:
                      text = text.replace('</head>', script + '\n</head>', 1)
                      changed = True
              if changed:
                  path.write_text(text, encoding='utf-8')
          PY

      - name: Remove other ad scripts from HTML pages
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          patterns = [
              re.compile(r'<script\b[^>]*src=["\']https://abscloud\.org/1/e5c38171d2db03d3e1ee2b2aa07dbcb5["\'][^>]*>\s*</script>\s*', re.I),
              re.compile(r'<script\b[^>]*src=["\']https://araplhn\.org/4/1efc26447bf1126ed64c5d7ef74e1a2b["\'][^>]*>\s*</script>\s*', re.I),
              re.compile(r'<script\b[^>]*src=["\']https://bauval\.org/14/c16c1dbab63fc823eea5b9ed42aac70b["\'][^>]*>\s*</script>\s*', re.I),
          ]
          for path in Path('.').rglob('*.html'):
              if '.git' in path.parts:
                  continue
              text = path.read_text(encoding='utf-8')
              updated = text
              for pattern in patterns:
                  updated = pattern.sub('', updated)
              if updated != text:
                  path.write_text(updated, encoding='utf-8')
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- '*.html'
          if git diff --cached --quiet; then
            echo "No HTML files needed updating."
          else
            git commit -m "Keep only Google AdSense"
            git push
          fi
