<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Protect PDF — PDF Ultra Pro</title><meta name="description" content="Password-protect a PDF directly in your browser."><link rel="canonical" href="https://pdf-ultra-pro.pages.dev/protect-pdf.html"><link rel="icon" href="icons/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="css/style.css"></head>
<body><div id="site-header"></div><main class="tool-page" id="main-content"><div class="container"><nav class="breadcrumb" aria-label="Breadcrumb"><a href="index.html">Home</a><span>/</span><a href="all-tools.html">All Tools</a><span>/</span><span>Protect PDF</span></nav><header class="tool-header"><div class="tool-icon" aria-hidden="true">🔒</div><h1>Protect PDF</h1><p>Password-protect your PDF directly in your browser. No server upload.</p></header>
<div class="tool-app"><div class="glass" style="padding:28px"><div class="alert alert-info" style="margin-top:0">🔒 Your PDF stays on this device. Choose a PDF below, then enter a password.</div>
<label class="dropzone" id="dropzone" tabindex="0" aria-label="Choose PDF file"><input id="pdfFile" type="file" accept="application/pdf,.pdf" style="position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer"><div style="font-size:36px;line-height:1">↑</div><p style="margin:8px 0 0;font-weight:600">Drag & drop your PDF here, or click to browse</p><p class="dz-hint">PDF · up to 100MB</p></label>
<div id="fileList" class="file-list"></div><div id="options" style="display:none"><label class="option-group" style="display:block"><span>Password</span><input id="password" type="password" autocomplete="new-password" minlength="1" placeholder="Enter a strong password" class="text-input"></label><label class="option-group" style="display:block"><span>Confirm password</span><input id="confirm" type="password" autocomplete="new-password" placeholder="Re-enter password" class="text-input"></label><button id="protectBtn" type="button" class="btn btn-primary">🔒 Protect & Download PDF</button></div><div id="status" class="alert" style="display:none;margin-top:18px"></div></div></div></div></main><div id="site-footer"></div>
<script src="js/theme.js"></script><script src="js/partials.js"></script><script src="https://cdn.jsdelivr.net/npm/@neslinesli93/qpdf-wasm@0.3.0/dist/qpdf.js"></script>
<script>(function(){'use strict';const $=id=>document.getElementById(id);let file=null,qpdf=null;const status=(m,ok=false)=>{const s=$("status");s.style.display=m?"block":"none";s.className="alert "+(ok?"alert-success":"alert-error");s.textContent=m;};const showFile=()=>{const list=$("fileList");list.replaceChildren();if(!file){$("options").style.display="none";return;}const row=document.createElement("div");row.className="file-row";const meta=document.createElement("div");meta.className="file-meta";const name=document.createElement("div");name.className="file-name";name.textContent=file.name;const size=document.createElement("div");size.className="file-size";size.textContent=(file.size/1048576).toFixed(2)+" MB";meta.append(name,size);const rm=document.createElement("button");rm.type="button";rm.className="file-remove";rm.textContent="×";rm.setAttribute("aria-label","Remove PDF");rm.onclick=()=>{file=null;$("pdfFile").value="";showFile();};row.append(meta,rm);list.append(row);$("options").style.display="block";};const setFile=f=>{if(!f)return;if(f.type!=="application/pdf"&&!/\.pdf$/i.test(f.name))return status("Please choose a PDF file.");if(f.size>100*1024*1024)return status("PDF is larger than 100MB.");file=f;status("");showFile();};const input=$("pdfFile"),dz=$("dropzone");input.addEventListener("click",e=>e.stopPropagation());input.addEventListener("change",e=>{setFile(e.target.files&&e.target.files[0]);});dz.addEventListener("keydown",e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();input.click();}});["dragenter","dragover"].forEach(x=>dz.addEventListener(x,e=>{e.preventDefault();e.stopPropagation();dz.classList.add("dragover");}));["dragleave","drop"].forEach(x=>dz.addEventListener(x,e=>{e.preventDefault();e.stopPropagation();dz.classList.remove("dragover");}));dz.addEventListener("drop",e=>setFile(e.dataTransfer.files&&e.dataTransfer.files[0]));
async function engine(){if(qpdf)return qpdf;if(typeof window.Module!=="function")throw new Error("PDF security engine did not load");qpdf=await window.Module({locateFile:()=>"https://cdn.jsdelivr.net/npm/@neslinesli93/qpdf-wasm@0.3.0/dist/qpdf.wasm",noInitialRun:true,preRun:[m=>{try{m.FS.mkdir("/pdfultrapro")}catch(e){}}]});return qpdf;}
$("protectBtn").addEventListener("click",async()=>{const p=$("password").value,c=$("confirm").value;if(!file)return status("Please upload a PDF first.");if(!p)return status("Please enter a password.");if(p!==c)return status("Passwords do not match.");const b=$("protectBtn");b.disabled=true;b.textContent="Preparing engine…";try{const q=await engine();status("Loading PDF security engine for the first time…",true);const input="/pdfultrapro/input.pdf",output="/pdfultrapro/output.pdf";q.FS.writeFile(input,new Uint8Array(await file.arrayBuffer()));try{q.FS.unlink(output)}catch(e){}const owner=Array.from(crypto.getRandomValues(new Uint8Array(24)),x=>x.toString(16).padStart(2,'0')).join('');b.textContent="Protecting…";const rc=q.callMain([input,"--encrypt",p,owner,"256","--print=full","--modify=none","--extract=n","--annotate=n","--form=n","--assemble=n","--",output]);if(rc!==0)throw new Error("qpdf failed");const out=q.FS.readFile(output);const blob=new Blob([out],{type:"application/pdf"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=file.name.replace(/\.pdf$/i,"")+"-protected.pdf";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000);status("PDF protected successfully.",true);}catch(e){console.error(e);status("Could not protect this PDF. Please reload Chrome and try again.");}finally{b.disabled=false;b.textContent="🔒 Protect & Download PDF";}});})();</script></body></html>
