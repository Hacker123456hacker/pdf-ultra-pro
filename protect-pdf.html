<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Protect PDF — PDF Ultra Pro</title><meta name="description" content="Password-protect a PDF directly in your browser."><link rel="icon" href="icons/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="css/style.css"></head><body><div id="site-header"></div><main class="tool-page"><div class="container"><nav class="breadcrumb"><a href="index.html">Home</a><span>/</span><a href="all-tools.html">All Tools</a><span>/</span><span>Protect PDF</span></nav><header class="tool-header"><div class="tool-icon">🔒</div><h1>Protect PDF</h1><p>Password-protect your PDF directly in your browser. No server upload.</p></header><div class="tool-app"><div class="glass" style="padding:28px"><div class="alert alert-info">🔒 Your PDF stays on this device. The first run downloads the PDF security engine.</div><div class="dropzone" id="dropzone" role="button" tabindex="0" aria-label="Choose PDF file"><input id="pdfFile" type="file" accept="application/pdf,.pdf" hidden><div style="font-size:36px;line-height:1">↑</div><p style="margin:8px 0;font-weight:600">Drag & drop your PDF here, or click to browse</p><p class="dz-hint">PDF · up to 100MB</p></div><div id="fileList" class="file-list"></div><div id="options" style="display:none"><label class="option-group"><span>Password</span><input id="password" type="password" autocomplete="new-password" placeholder="Enter a strong password" class="text-input"></label><label class="option-group"><span>Confirm password</span><input id="confirm" type="password" autocomplete="new-password" placeholder="Re-enter password" class="text-input"></label><button id="protectBtn" type="button" class="btn btn-primary">🔒 Protect & Download PDF</button></div><div id="status" class="alert" style="display:none;margin-top:18px"></div></div></div></div></main><div id="site-footer"></div><script src="js/theme.js"></script><script src="js/partials.js"></script><script type="module">import{protectPdf}from'./js/pdf-security.js';const $=id=>document.getElementById(id);let file=null;function msg(t,ok=false){const s=$("status");s.style.display=t?'block':'none';s.className='alert '+(ok?'alert-success':'alert-error');s.textContent=t}function show(){const l=$("fileList");l.replaceChildren();if(!file){$("options").style.display='none';return}const r=document.createElement('div');r.className='file-row';const m=document.createElement('div');m.className='file-meta';const n=document.createElement('div');n.className='file-name';n.textContent=file.name;const z=document.createElement('div');z.className='file-size';z.textContent=(file.size/1048576).toFixed(2)+' MB';m.append(n,z);const x=document.createElement('button');x.type='button';x.className='file-remove';x.textContent='×';x.onclick=()=>{file=null;show()};r.append(m,x);l.append(r);$("options").style.display='block'}function setFile(f){if(!f)return;if(f.type!=='application/pdf'&&!/\.pdf$/i.test(f.name))return msg('Please choose a PDF file.');if(f.size>100*1024*1024)return msg('PDF is larger than 100MB.');file=f;msg('');show()}const dz=$("dropzone"),input=$("pdfFile");dz.onclick=()=>input.click();input.onclick=e=>e.stopPropagation();input.onchange=e=>setFile(e.target.files?.[0]);dz.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();input.click()}};['dragenter','dragover'].forEach(t=>dz.addEventListener(t,e=>{e.preventDefault();dz.classList.add('dragover')}));['dragleave','drop'].forEach(t=>dz.addEventListener(t,e=>{e.preventDefault();dz.classList.remove('dragover')}));dz.addEventListener('drop',e=>setFile(e.dataTransfer.files?.[0]));$("protectBtn").onclick=async()=>{const p=$("password").value,c=$("confirm").value;if(!file)return msg('Please upload a PDF first.');if(!p)return msg('Please enter a password.');if(p!==c)return msg('Passwords do not match.');const b=$("protectBtn");b.disabled=true;b.textContent='Loading engine…';try{msg('Loading PDF security engine…',true);const out=await protectPdf(file,p);const u=URL.createObjectURL(new Blob([out],{type:'application/pdf'}));const a=document.createElement('a');a.href=u;a.download=file.name.replace(/\.pdf$/i,'')+'-protected.pdf';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),3000);msg('PDF protected successfully.',true)}catch(e){console.error(e);msg('Could not protect this PDF: '+(e?.message||'PDF engine error'))}finally{b.disabled=false;b.textContent='🔒 Protect & Download PDF'}};</script></body></html>
