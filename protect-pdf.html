<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Protect PDF — PDF Ultra Pro</title><meta name="description" content="Password-protect a PDF directly in your browser. No upload needed."><link rel="canonical" href="https://pdf-ultra-pro.pages.dev/protect-pdf.html"><link rel="icon" href="icons/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="css/style.css"></head>
<body data-tool="protect-pdf"><div id="site-header"></div><main class="tool-page" id="main-content"><div class="container"><nav class="breadcrumb" aria-label="Breadcrumb"><a href="index.html">Home</a><span>/</span><a href="all-tools.html">All Tools</a><span>/</span><span aria-current="page">Protect PDF</span></nav><header class="tool-header"><div class="tool-icon" aria-hidden="true">🔒</div><h1>Protect PDF</h1><p>Password-protect your PDF directly in your browser. No upload.</p></header><div class="tool-app"><div class="glass" style="padding:28px"><div class="alert alert-info">🔒 Your PDF stays on this device. No upload is needed.</div><div class="dropzone" id="dropzone" role="button" tabindex="0" aria-label="Choose PDF file"><input id="pdfFile" type="file" accept="application/pdf,.pdf" hidden><div style="font-size:36px;line-height:1">↑</div><p style="margin:8px 0;font-weight:600">Tap here to choose your PDF</p><p class="dz-hint">PDF · up to 100MB</p></div><div id="fileList" class="file-list"></div><div id="options" style="display:none"><label class="option-group"><span>Password</span><input id="password" type="password" autocomplete="new-password" placeholder="Enter a strong password" class="text-input"></label><label class="option-group"><span>Confirm password</span><input id="confirm" type="password" autocomplete="new-password" placeholder="Re-enter password" class="text-input"></label><button id="protectBtn" type="button" class="btn btn-primary">🔒 Protect &amp; Download PDF</button></div><div id="status" class="alert" style="display:none;margin-top:18px"></div></div></div></div></main><div id="site-footer"></div><script src="js/theme.js"></script><script src="js/partials.js"></script><script>
document.addEventListener('DOMContentLoaded',function(){const $=id=>document.getElementById(id);let file=null;const input=$('pdfFile'),dz=$('dropzone'),list=$('fileList'),options=$('options'),status=$('status'),button=$('protectBtn');function msg(t,ok=false){status.style.display=t?'block':'none';status.className='alert '+(ok?'alert-success':'alert-error');status.textContent=t||''}function render(){list.replaceChildren();options.style.display=file?'block':'none';if(!file)return;const row=document.createElement('div');row.className='file-row';const meta=document.createElement('div');meta.className='file-meta';const name=document.createElement('div');name.className='file-name';name.textContent=file.name;const size=document.createElement('div');size.className='file-size';size.textContent=(file.size/1048576).toFixed(2)+' MB';meta.append(name,size);const remove=document.createElement('button');remove.type='button';remove.className='file-remove';remove.textContent='×';remove.onclick=()=>{file=null;input.value='';render()};row.append(meta,remove);list.append(row)}function setFile(f){if(!f)return;if(f.type!=='application/pdf'&&!/\.pdf$/i.test(f.name))return msg('Please choose a PDF file.');if(f.size>100*1024*1024)return msg('PDF is larger than 100MB.');file=f;msg('');render()}dz.addEventListener('click',()=>input.click());dz.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();input.click()}});input.addEventListener('change',e=>setFile(e.target.files&&e.target.files[0]));['dragenter','dragover'].forEach(t=>dz.addEventListener(t,e=>{e.preventDefault();dz.classList.add('dragover')}));['dragleave','drop'].forEach(t=>dz.addEventListener(t,e=>{e.preventDefault();dz.classList.remove('dragover')}));dz.addEventListener('drop',e=>setFile(e.dataTransfer&&e.dataTransfer.files&&e.dataTransfer.files[0]));button.addEventListener('click',async()=>{const p=$('password').value,c=$('confirm').value;if(!file)return msg('Please choose a PDF first.');if(!p)return msg('Please enter a password.');if(p!==c)return msg('Passwords do not match.');button.disabled=true;button.textContent='Encrypting…';try{msg('Encrypting PDF…',true);const mod=await import('./js/pdf-security.js');const out=await mod.protectPdf(file,p);if(!out||!out.byteLength)throw new Error('The PDF engine returned an empty file.');const url=URL.createObjectURL(new Blob([out],{type:'application/pdf'}));const a=document.createElement('a');a.href=url;a.download=file.name.replace(/\.pdf$/i,'')+'-protected.pdf';a.style.display='none';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),5000);msg('PDF protected successfully.',true)}catch(e){console.error(e);msg('Could not protect this PDF: '+(e&&e.message||'PDF engine error'))}finally{button.disabled=false;button.textContent='🔒 Protect & Download PDF'}})});
</script></body></html>
