<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Unlock PDF — PDF Ultra Pro</title><meta name="description" content="Remove the password from a PDF you own when you know the password, directly in your browser."><link rel="canonical" href="https://pdf-ultra-pro.pages.dev/unlock-pdf.html"><link rel="icon" href="icons/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="css/style.css"></head><body><div id="site-header"></div><main class="tool-page" id="main-content"><div class="container"><nav class="breadcrumb" aria-label="Breadcrumb"><a href="index.html">Home</a><span>/</span><a href="all-tools.html">All Tools</a><span>/</span><span>Unlock PDF</span></nav><header class="tool-header"><div class="tool-icon" aria-hidden="true"><svg width="26" height="26" viewBox="0 0 24 24" fill="none"><rect x="5" y="11" width="14" height="9" rx="2" stroke="currentColor" stroke-width="1.8"/><path d="M8 11V8a4 4 0 0 1 7.4-2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></div><h1>Unlock PDF</h1><p>Remove protection from a PDF you own when you already know its password.</p></header><div class="tool-app"><div class="glass" style="padding:28px"><div class="alert alert-info" style="margin-top:0">🔓 This tool does not guess or bypass passwords. Enter the correct password; processing happens locally in your browser.</div><label class="option-group" style="display:block"><span>Choose protected PDF</span><input id="pdfFile" type="file" accept="application/pdf" class="file-input"></label><label class="option-group" style="display:block"><span>PDF password</span><input id="password" type="password" autocomplete="current-password" placeholder="Enter the existing password" class="text-input"></label><button id="unlockBtn" type="button" class="btn btn-primary">🔓 Unlock & Download PDF</button><div id="status" class="alert" style="display:none;margin-top:18px"></div></div></div></div></main><div id="site-footer"></div><script src="js/theme.js"></script><script src="js/partials.js"></script><script src="https://cdn.jsdelivr.net/npm/@cantoo/pdf-lib@2.9.1/dist/pdf-lib.min.js"></script><script>(function(){const $=id=>document.getElementById(id);const status=(m,ok)=>{const s=$("status");s.style.display="block";s.className="alert "+(ok?"alert-success":"alert-error");s.textContent=m;};$("unlockBtn").addEventListener("click",async()=>{const f=$("pdfFile").files[0],p=$("password").value;if(!f)return status("Please choose a PDF first.");if(!p)return status("Please enter the PDF password.");const b=$("unlockBtn");b.disabled=true;b.textContent="Unlocking…";try{if(!window.PDFLib||!PDFLib.PDFDocument)throw new Error("engine");const bytes=new Uint8Array(await f.arrayBuffer());const doc=await PDFLib.PDFDocument.load(bytes,{password:p});const out=await doc.save({rewrite:true,useObjectStreams:false});const blob=new Blob([out],{type:"application/pdf"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=f.name.replace(/\.pdf$/i,"")+"-unlocked.pdf";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);status("PDF unlocked successfully. The downloaded copy no longer requires the password.",true);}catch(e){console.error(e);status("Could not unlock this PDF. Check the password and make sure the PDF format is supported.");}finally{b.disabled=false;b.textContent="🔓 Unlock & Download PDF";}});})();</script></body></html>
